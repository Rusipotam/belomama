# QuizPlugin Rewards Configuration
#
# This file defines rewards for each difficulty level
# Each reward includes:
# - material: The item type (Minecraft material name)
# - name: Display name (supports & color codes)
# - lore: List of lore lines (supports & color codes)
# - points: Quiz points awarded
#
# Additional lore (date + question ID) is automatically added by the plugin

# Easy difficulty reward
easy:
  material: IRON_INGOT
  name: "&a&lQuiz Reward &7(Easy)"
  lore:
    - "&7You answered an easy question"
    - "&7correctly! Keep practicing!"
    - ""
    - "&a+1 Quiz Point"
  points: 1

# Medium difficulty reward
medium:
  material: GOLD_INGOT
  name: "&e&lQuiz Reward &7(Medium)"
  lore:
    - "&7You answered a medium difficulty"
    - "&7question correctly! Great job!"
    - ""
    - "&e+2 Quiz Points"
  points: 2

# Hard difficulty reward
