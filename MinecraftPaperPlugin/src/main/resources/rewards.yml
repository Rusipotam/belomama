  material: DIAMOND
  name: "&b&lQuiz Reward &7(Hard)"
  lore:
    - "&7You answered a hard question"
    - "&7correctly! Excellent work!"
    - ""
    - "&b+3 Quiz Points"
  points: 3

# Blank reward template 1
# Customize this for special events or custom difficulty levels
